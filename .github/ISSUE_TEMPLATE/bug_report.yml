name: Bug report
description: Report behavior that is incorrect, unsafe, or inconsistent across surfaces
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove private corpus text, credentials, tokens, email addresses, and machine-specific paths before posting. Use a private security advisory for vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command or API/MCP request, exit code, and the smallest safe output that shows the problem.
      placeholder: recall query ... exited 0, but one configured source timed out and coverage was reported complete.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What outcome, coverage, source report, or result did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer a synthetic fixture or a tiny public corpus.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Recall version
      description: Output from `recall version`, including the commit.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - HTTP API
        - MCP
        - Go adapter SDK
        - Adapter protocol or conformance
        - Evaluation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal source material, and private paths from this report.
          required: true
