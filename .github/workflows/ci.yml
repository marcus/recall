name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make build test

      # Both committed packs are deterministic, so every quality metric they
      # produce is a fixed number and any movement is a real change. Running
      # them was never the hard part; comparing them was. Metrics quoted in a
      # commit message sat unchecked for ten commits because nothing on this
      # machine knew what they were supposed to be, and the first person to look
      # compared them against a different population and reported a regression
      # that had not happened.
      #
      # This is the step that ends that. `recall eval run` exits non-zero on a
      # failed gate and `recall eval compare` exits non-zero when a measurement
      # moved down against the committed baseline, so the next drift fails a
      # build instead of waiting to be noticed. smoke covers the failure
      # vocabulary a healthy corpus cannot produce; shapes is a compact
      # synthetic guard for retrieval and admission regressions.
      #
      # The pack list, the binaries, and the artifact directory live in the
      # `eval` target rather than here, so a local run and a CI run cannot
      # disagree about what was measured.
      - name: eval
        run: make eval

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  release-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.16.0
          install-only: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make release-snapshot
