# Project configuration. It travels with this repository and is untrusted.
#
# It may narrow scope, adjust priors and budgets, and add sources of its own.
# It may not say anything about what Recall executes, where a source the user
# declared reads from, or which profile is active.

[[sources]]
# Tunes a source the user declared. It may adjust ranking and budget, but not
# location, settings, or enablement: those decide what data answers under a
# trusted source's name.
source_id = "clara-docs"
base_prior = 1.6
timeout_ms = 900

[[sources]]
# A source this repository introduces. It does not declare an identity — a
# project file may not choose one, so Recall derives it from this file's path
# and the source name.
source_id = "repo-notes"
adapter = "documents"
location = "./notes"
freshness_mode = "indexed"
sensitivity = "public"
base_prior = 0.8

[sources.settings]
glob = "**/*.md"

[profiles.work]
sources = ["tasks", "clara-docs", "repo-notes"]
# A project may lower a ceiling. It may never raise one.
max_sensitivity = "internal"
