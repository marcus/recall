# Project configuration. It travels with this repository and is untrusted.
#
# It may point a source at this checkout, narrow scope, adjust priors and
# budgets, and add sources of its own. It may not say anything about what
# Recall executes.

[[sources]]
# Adjusts a source the user declared. It does not restate source_uid: the
# identity belongs to the layer that created it.
source_id = "clara-docs"
location = "docs"
base_prior = 1.6
timeout_ms = 900

[[sources]]
# A source this repository introduces. A new source needs its own immutable
# identity, and that identity must not already belong to another source.
source_uid = "01J8ZKQ4MAREPO"
source_id = "repo-notes"
adapter = "documents"
location = "notes"
freshness_mode = "indexed"
sensitivity = "public"
base_prior = 0.8

[sources.settings]
glob = "**/*.md"

[profiles.work]
sources = ["tasks", "clara-docs", "repo-notes"]
# A project may lower a ceiling. It may never raise one.
max_sensitivity = "internal"
